<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Guarda-Roupa</title>
  <link rel="stylesheet" href="style.css">
  <script src="scripts.js" defer></script>
</head>
<body>

  
  <h1>Monte seu Guarda Roupa!</h1>

<!-- Formulário de Cadastro e Edição -->
  <form id="form-produto">
    <input type="hidden" id="produto-id">
    <input type="text" id="titulo" placeholder="Nome do produto" required>
    <input type="number" id="preco" placeholder="Preço" step="0.01" required>
    <input type="url" id="imagem" placeholder="URL da imagem (opcional)">
    <button type="submit" id="btn-salvar">Adicionar ao Catálogo</button>
    <button type="button" id="btn-cancelar" style="display: none;">Cancelar</button>
  </form>
  
  <!-- Campo de Consulta / Pesquisa -->
  <div style="margin-bottom: 20px;">
    <input type="search" id="campo-busca" placeholder="Consultar produto pelo nome..." style="width: 100%; max-width: 400px;">
  </div>

  <!-- Onde os itens vão aparecer (GET) -->
  <div id="catalogo-container" class="grid"></div>

  <script src="scripts.js"></script>
</body>
</html>
